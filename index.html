
<!DOCTYPE html>
<html>
<head>
    <title>Student Result Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Result Management System</h1>

        <div class="form">
            <input type="text" id="name" placeholder="Student Name">
            <input type="text" id="roll" placeholder="Roll Number">

            <input type="number" id="m1" placeholder="Subject 1 Marks">
            <input type="number" id="m2" placeholder="Subject 2 Marks">
            <input type="number" id="m3" placeholder="Subject 3 Marks">

            <button onclick="addResult()">Add Result</button>
        </div>

        <h2>Student Results</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Total</th>
                    <th>Percentage</th>
                    <th>Result</th>
                </tr>
            </thead>

            <tbody id="resultList">
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
